[package]
name = "kcache"
version = "0.1.3"
description = "Kcache — GPU shader cache manager & game launcher for PC gamers"
authors = ["Kcache"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "kcache_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
zstd = "0.13"
lz4_flex = "0.11"
tar = "0.4"
walkdir = "2"
fuzzy-matcher = "0.3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
log = "0.4"
env_logger = "0.11"
dirs = "5"
regex = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
libloading = "0.8"
serde_yaml = "0.9.34"
zip = "4.2.0"
keyring = "3.6.3"
urlencoding = "2.1.3"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
